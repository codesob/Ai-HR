name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aihr
          POSTGRES_USER: aihr
          POSTGRES_PASSWORD: aihr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aihr" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Lockfile matches requirements.in
        run: |
          cp requirements.txt /tmp/req.txt
          uv pip compile requirements.in --python-version 3.14 --python-platform linux -o /tmp/req.txt -q
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)
      - run: ruff check .
      - run: pytest -q
      - name: Migrations apply on PostgreSQL and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://aihr:aihr@localhost:5432/aihr
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api-gateway, app_module: "main:app", ml: "false" }
          - { service: resume-parsing-svc, app_module: "app.main:app", ml: "true" }
          - { service: matching-engine-svc, app_module: "app.main:app", ml: "true" }
          - { service: chatbot-rag-assistant-svc, app_module: "app.main:app", ml: "true" }
          - { service: interview-assistant-svc, app_module: "app.main:app", ml: "false" }
          - { service: analytics-dashboard-svc, app_module: "app.main:app", ml: "false" }
          - { service: hr-ops-onboarding-svc, app_module: "app.main:app", ml: "false" }
          - { service: payroll-automation-svc, app_module: "app.main:app", ml: "false" }
          - { service: notification-scheduling-svc, app_module: "app.main:app", ml: "false" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: aihr/${{ matrix.service }}:ci
          build-args: |
            SERVICE=${{ matrix.service }}
            APP_MODULE=${{ matrix.app_module }}
            WITH_ML=${{ matrix.ml }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Container boots and answers /health
        run: |
          docker run -d --name svc -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db aihr/${{ matrix.service }}:ci
          for i in $(seq 1 30); do
            docker exec svc python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" && exit 0
            sleep 2
          done
          docker logs svc; exit 1

  frontend-image:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
