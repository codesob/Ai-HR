[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008", "E501", "I001"]
