# Private, durable Render layout for the AI-HR application.
# Only the API gateway is public. Feature APIs and Qdrant use Render's private network.
# Estimated compute and storage charges are documented in docs/deployment/render.md.
envVarGroups:
  - name: codesob-aihr-production-common
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ORIGINS
        value: https://hire-lens-ai-platform.vercel.app
      - key: FRONTEND_URL
        value: https://hire-lens-ai-platform.vercel.app
      - key: WEB_CONCURRENCY
        value: "1"

services:
  - type: web
    name: codesob-aihr-api
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m shared.db.migrate
    startCommand: uvicorn main:app --app-dir api-gateway --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: codesob-aihr-production-common
      - key: DATABASE_URL
        fromDatabase:
          name: codesob-aihr-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: codesob-aihr-redis
          property: connectionString
      - key: QDRANT_URL
        fromService:
          type: pserv
          name: codesob-aihr-qdrant
          property: hostport
      - key: QDRANT_API_KEY
        fromService:
          type: pserv
          name: codesob-aihr-qdrant
          envVarKey: QDRANT__SERVICE__API_KEY
      - key: RESUME_SERVICE_URL
        fromService:
          type: pserv
          name: codesob-aihr-resume
          property: hostport
      - key: MATCHING_SERVICE_URL
        fromService:
          type: pserv
          name: codesob-aihr-matching
          property: hostport
      - key: INTERVIEW_SERVICE_URL
        fromService:
          type: pserv
          name: codesob-aihr-interview
          property: hostport
      - key: ANALYTICS_SERVICE_URL
        fromService:
          type: pserv
          name: codesob-aihr-analytics
          property: hostport
      - key: HR_OPS_SERVICE_URL
        fromService:
          type: pserv
          name: codesob-aihr-hr-ops
          property: hostport
      - key: CHATBOT_SERVICE_URL
        fromService:
          type: pserv
          name: codesob-aihr-chatbot
          property: hostport
      - key: PAYROLL_SERVICE_URL
        fromService:
          type: pserv
          name: codesob-aihr-payroll
          property: hostport
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          type: pserv
          name: codesob-aihr-notifications
          property: hostport

  - type: pserv
    name: codesob-aihr-resume
    runtime: python
    plan: 1c-2g
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -r requirements-ml.txt --extra-index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn app.main:app --app-dir resume-parsing-svc --host 0.0.0.0 --port 10000 --workers 1
    autoDeployTrigger: checksPass
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - fromGroup: codesob-aihr-production-common
      - key: DATABASE_URL
        fromDatabase:
          name: codesob-aihr-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: codesob-aihr-redis
          property: connectionString
      - key: QDRANT_URL
        fromService:
          type: pserv
          name: codesob-aihr-qdrant
          property: hostport
      - key: QDRANT_API_KEY
        fromService:
          type: pserv
          name: codesob-aihr-qdrant
          envVarKey: QDRANT__SERVICE__API_KEY
      - key: UPLOAD_DIR
        value: /var/data/uploads

  - type: pserv
    name: codesob-aihr-matching
    runtime: python
    plan: 1c-2g
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -r requirements-ml.txt --extra-index-url https://download.pytorch.org/whl/cpu
