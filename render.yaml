      - key: QDRANT_URL
        fromService:
          type: pserv
          name: codesob-aihr-qdrant
          property: hostport
      - key: QDRANT_API_KEY
        fromService:
          type: pserv
          name: codesob-aihr-qdrant
          envVarKey: QDRANT__SERVICE__API_KEY

  - type: pserv
