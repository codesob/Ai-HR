  - type: pserv
    name: codesob-aihr-qdrant
    runtime: image
    image:
      url: qdrant/qdrant:v1.20.0
    plan: 0.5c-512mb
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 10
    envVars:
      - key: QDRANT__SERVICE__API_KEY
        generateValue: true
      - key: QDRANT__SERVICE__HTTP_PORT
        value: "6333"

  - type: keyvalue
    name: codesob-aihr-redis
    plan: 256mb
    region: oregon
    ipAllowList: []

databases:
  - name: codesob-aihr-postgres
    databaseName: aihr
    user: aihr
    plan: 0.5c-1g
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
