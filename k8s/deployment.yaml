apiVersion: apps/v1
kind: Deployment
metadata:
  name: aihr-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aihr-backend
  template:
    metadata:
      labels:
        app: aihr-backend
    spec:
      containers:
        - name: backend
          image: aihr-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aihr-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: aihr-backend
spec:
  selector:
    app: aihr-backend
  ports:
    - port: 8000
      targetPort: 8000
